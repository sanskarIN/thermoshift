name: Refresh Lockfiles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lockfiles.yml'

permissions:
  contents: write

concurrency:
  group: lockfiles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'sanskarIN/thermoshift'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate npm lockfile
        run: npm install --ignore-scripts --package-lock-only --no-audit --no-fund
      - name: Generate Cargo lockfile
        run: cargo generate-lockfile
      - name: Verify generated lockfiles
        run: |
          test -s package-lock.json
          test -s Cargo.lock
          npm run check:versions
          npm run check:desktop-config
          npm run check:docs
      - name: Upload generated lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: thermoshift-generated-lockfiles-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            package-lock.json
            Cargo.lock
          if-no-files-found: error
          retention-days: 14
      - name: Commit refreshed lockfiles and restore manual workflow
        shell: bash
        run: |
          printf '%s' '' | base64 -d > .github/workflows/lockfiles.yml

          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add package-lock.json Cargo.lock .github/workflows/lockfiles.yml
          git commit -m "build: refresh 2.8.2 dependency lockfiles"

          git fetch origin "$TARGET_BRANCH"
          EXPECTED_PARENT="$(git rev-parse HEAD^)"
          REMOTE_HEAD="$(git rev-parse FETCH_HEAD)"
          if [ "$REMOTE_HEAD" != "$EXPECTED_PARENT" ]; then
            echo "Branch advanced from $EXPECTED_PARENT to $REMOTE_HEAD; rerun lockfile generation on the new head."
            exit 1
          fi

          git push origin "HEAD:${TARGET_BRANCH}"
