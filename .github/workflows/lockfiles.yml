name: Refresh Lockfiles

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfiles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'sanskarIN/thermoshift'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate npm lockfile
        run: npm install --ignore-scripts --package-lock-only --no-audit --no-fund
      - name: Generate Cargo lockfile
        run: cargo generate-lockfile
      - name: Verify generated lockfiles
        run: |
          test -s package-lock.json
          test -s Cargo.lock
          npm run check:versions
          npm run check:desktop-config
          npm run check:mobile-config
          npm run check:docs
      - name: Upload generated lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: thermoshift-generated-lockfiles-${{ github.sha }}
          path: |
            package-lock.json
            Cargo.lock
          if-no-files-found: error
          retention-days: 14
      - name: Commit lockfiles when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json Cargo.lock && git ls-files --error-unmatch package-lock.json Cargo.lock >/dev/null 2>&1; then
            echo "Lockfiles are already current."
            exit 0
          fi

          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add package-lock.json Cargo.lock
          git commit -m "build: refresh dependency lockfiles"

          git fetch origin "${GITHUB_REF_NAME}"
          EXPECTED_PARENT="$(git rev-parse HEAD^)"
          REMOTE_HEAD="$(git rev-parse FETCH_HEAD)"
          if [ "$REMOTE_HEAD" != "$EXPECTED_PARENT" ]; then
            echo "Branch advanced from $EXPECTED_PARENT to $REMOTE_HEAD; rerun lockfile generation on the new head."
            exit 1
          fi

          git push origin "HEAD:${GITHUB_REF_NAME}"
