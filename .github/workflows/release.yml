name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  web-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Check manifest versions
        run: npm run check:versions
      - name: Check tag matches package version
        run: |
          EXPECTED_TAG="v$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG" || { echo "Tag $GITHUB_REF_NAME does not match $EXPECTED_TAG"; exit 1; }
      - run: npm install --ignore-scripts
      - run: cargo test -p thermoshift-core
      - run: npm --workspace @thermoshift/web run typecheck
      - run: npm --workspace @thermoshift/web run lint
      - run: npm --workspace @thermoshift/web run test
      - run: npm --workspace @thermoshift/web run build
      - name: Package web build
        run: tar -czf thermoshift-web-${{ github.ref_name }}.tar.gz -C apps/web/dist .
      - name: Generate SHA-256 checksum
        run: sha256sum thermoshift-web-${{ github.ref_name }}.tar.gz > thermoshift-web-${{ github.ref_name }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            thermoshift-web-${{ github.ref_name }}.tar.gz
            thermoshift-web-${{ github.ref_name }}.tar.gz.sha256
