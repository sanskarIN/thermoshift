name: Sync Handoff Checkpoint

on:
  push:
    branches: [build/thermoshift-v0.2]
    paths:
      - '.github/workflows/handoff-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    if: github.repository == 'sanskarIN/thermoshift'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Append continuation checkpoint
        shell: bash
        run: |
          if grep -q 'Continuation checkpoint — release input preflight' what_changed.md; then
            echo 'Checkpoint already present.'
            exit 0
          fi
          cat >> what_changed.md <<'EOF'

---

# Continuation checkpoint — release input preflight

This checkpoint was appended without replacing or shortening the earlier handoff history.

## Exact branch state before this checkpoint

- Pull request: #11 (`build/thermoshift-v0.2` → `main`).
- Base SHA remains `648662788597dcfbbc0db7eb9021f1863c764fb5`.
- Pre-checkpoint PR head inspected: `65889db0488ff8f93c66a230aa13feed112c5e83`.
- Pre-checkpoint PR metadata: 171 commits, 82 changed files, 5699 additions, 451 deletions.
- PR is open, non-draft, mergeable, and not merged.

## Source-of-truth corrections retained

- `package-lock.json` is still absent at this checkpoint; do not claim npm locked installation yet.
- Generated desktop PNG icons now exist in `apps/desktop/src-tauri/icons/` (`32x32.png`, `128x128.png`, `128x128@2x.png`).
- `icon.ico` / `icon.icns` and the full intended platform icon set still require exact file verification before being called complete.
- Verified product screenshot PNGs remain release evidence, not placeholders.
- Hosted PR CI/CodeQL/security conclusions must be read from the current head; older cancelled/superseded runs are not release evidence.
- No stable `v0.2.0` tag/release is claimed.

## New work completed in this continuation

### Lockfile workflow hardening

`.github/workflows/lockfiles.yml` now:

- has a bounded 20-minute job timeout;
- uses persistent checkout credentials for its intended branch commit;
- configures Node 22 explicitly;
- generates npm lock data with `--package-lock-only --ignore-scripts --no-audit --no-fund`;
- generates Cargo lock data with `cargo generate-lockfile`;
- verifies version consistency, Tauri frontend configuration, and internal documentation links before commit;
- uploads generated lockfiles as SHA-specific workflow evidence;
- commits with `Sanskar <sanskarin@outlook.in>`;
- rebases once onto the newest branch head before pushing so concurrent documentation commits do not cause a non-fast-forward loss of valid generated lockfiles.

The generator has been source-triggered again. Until `package-lock.json` and `Cargo.lock` actually appear in the branch, their completion remains open.

### Exact release-input preflight

Added `scripts/check-release-inputs.mjs`.

It rejects a release candidate when required source/evidence files are missing or empty, including:

- npm and Cargo lockfiles;
- core npm/Rust/Tauri manifests;
- primary generated desktop PNG icons;
- release/security/privacy documentation.

It also supports `--screenshots` to require the complete eight-image verified screenshot set when preparing a screenshot-complete candidate.

No placeholder file is created to satisfy this check.

### Root commands

Added:

- `npm run check:release-inputs`;
- `npm run check:release-inputs:screenshots`.

### Tagged release gate

`.github/workflows/release.yml` now:

- runs the exact release-input preflight before dependency installation;
- fails early when committed lockfiles/evidence are missing;
- uses `npm ci --ignore-scripts` instead of floating `npm install` once the lockfile exists;
- runs canonical Rust tests and Clippy with Cargo `--locked`;
- retains version, Tauri config, docs-link, typecheck, lint, coverage, real WASM/PWA build, asset-budget, Playwright/axe, archive, and SHA-256 checksum gates.

This deliberately makes an accidental `v0.2.0` tag fail rather than publish from an incomplete dependency graph.

### Environment limitation recorded

A clean direct `git clone` fallback was attempted from the execution container, but DNS resolution for `github.com` was unavailable there. No dependency metadata was fabricated from that failed path. GitHub repository files/connector state remain the source of truth.

## Immediate continuation order

1. Confirm whether the hardened lockfile workflow actually commits `package-lock.json` and `Cargo.lock`.
2. If lockfiles land, review them and switch remaining CI/security/setup paths to reproducible locked commands where not already converted.
3. Verify the complete generated icon set and explicit Tauri bundle icon configuration.
4. Run/review verified screenshot capture only from the exact build candidate.
5. Inspect current-head CI, CodeQL, Gitleaks, RustSec, npm audit, and E2E results.
6. Run/review unsigned Linux/Windows/macOS desktop bundle evidence.
7. Keep `v0.2.0` untagged until the exact-candidate release-evidence document is satisfied.

GitHub files, PR metadata, exact workflow results, and generated artifacts remain authoritative.
EOF
      - name: Commit handoff update
        shell: bash
        run: |
          if git diff --quiet -- what_changed.md; then
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add what_changed.md
          git commit -m "docs: append release preflight checkpoint"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
