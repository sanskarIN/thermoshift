name: Desktop Platform Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-14
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Verify repository metadata
        run: npm run check:versions
      - name: Verify desktop frontend configuration
        run: npm run check:desktop-config
      - name: Check desktop Rust crate
        run: cargo check --locked -p thermoshift-desktop
      - name: Build unsigned native package
        run: npm run desktop:build
      - name: Upload native bundle evidence
        uses: actions/upload-artifact@v4
        with:
          name: thermoshift-${{ matrix.artifact }}-bundle
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
