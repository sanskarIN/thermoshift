name: Desktop Platform Verification

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-15
            artifact: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Require exact release inputs
        run: npm run check:release-inputs
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Verify repository metadata
        run: |
          npm run check:versions
          npm run check:desktop-config
          npm run check:mobile-config
          npm run check:docs
      - name: Check desktop Rust crate
        run: cargo check --locked -p thermoshift-desktop
      - name: Build unsigned native package
        run: npm run desktop:build
      - name: Write candidate metadata
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/target/release/bundle
          printf 'candidate_sha=%s\nref=%s\nos=%s\n' "$CANDIDATE_SHA" "$GITHUB_REF" "${{ matrix.artifact }}" > apps/desktop/src-tauri/target/release/bundle/THERMOSHIFT_BUILD.txt
      - name: Upload native bundle evidence
        uses: actions/upload-artifact@v4
        with:
          name: thermoshift-${{ matrix.artifact }}-bundle-${{ env.CANDIDATE_SHA }}
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
