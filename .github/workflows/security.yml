name: Dependency Security

on:
  pull_request:
  schedule:
    - cron: '41 4 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure audit lockfile exists
        shell: bash
        run: |
          if test -s Cargo.lock; then
            echo 'Auditing committed Cargo.lock.'
          else
            echo 'Cargo.lock is not committed yet; generating an ephemeral audit lockfile.'
            cargo generate-lockfile
          fi
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure audit lockfile exists
        shell: bash
        run: |
          if test -s package-lock.json; then
            echo 'Auditing committed package-lock.json.'
          else
            echo 'package-lock.json is not committed yet; generating an ephemeral audit lockfile.'
            npm install --ignore-scripts --package-lock-only --no-audit --no-fund
          fi
      - run: npm audit --audit-level=high
