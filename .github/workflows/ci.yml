name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report dependency lock state
        shell: bash
        run: |
          if test -s package-lock.json; then echo 'npm lock: committed'; else echo 'npm lock: pending'; fi
          if test -s Cargo.lock; then echo 'Cargo lock: committed'; else echo 'Cargo lock: pending'; fi
      - name: Check version consistency
        run: npm run check:versions
      - name: Check desktop frontend configuration
        run: npm run check:desktop-config
      - name: Check internal documentation links
        run: npm run check:docs
      - name: Test release preflight and provenance tooling
        run: npm run test:release-tools

  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test canonical engine
        shell: bash
        run: |
          if test -s Cargo.lock; then
            cargo test --locked -p thermoshift-core
          else
            cargo test -p thermoshift-core
          fi
      - name: Lint canonical engine and WASM bridge
        shell: bash
        run: |
          if test -s Cargo.lock; then
            cargo clippy --locked -p thermoshift-core -p thermoshift-wasm --all-targets -- -D warnings
          else
            cargo clippy -p thermoshift-core -p thermoshift-wasm --all-targets -- -D warnings
          fi

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install JavaScript dependencies
        shell: bash
        run: |
          if test -s package-lock.json; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
      - run: npm --workspace @thermoshift/web run wasm:build
      - run: npm --workspace @thermoshift/web run typecheck
      - run: npm --workspace @thermoshift/web run lint
      - run: npm --workspace @thermoshift/web run test
      - run: npm --workspace @thermoshift/web run build:web
      - name: Enforce production asset budget
        run: npm run check:web-budget

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [metadata, rust-core, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install JavaScript dependencies
        shell: bash
        run: |
          if test -s package-lock.json; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm --workspace @thermoshift/web run e2e
