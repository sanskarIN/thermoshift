name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version consistency
        run: npm run check:versions

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test canonical engine
        run: cargo test -p thermoshift-core
      - name: Lint canonical engine and WASM bridge
        run: cargo clippy -p thermoshift-core -p thermoshift-wasm --all-targets -- -D warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm install --ignore-scripts
      - run: npm --workspace @thermoshift/web run wasm:build
      - run: npm --workspace @thermoshift/web run typecheck
      - run: npm --workspace @thermoshift/web run lint
      - run: npm --workspace @thermoshift/web run test
      - run: npm --workspace @thermoshift/web run build:web

  e2e:
    runs-on: ubuntu-latest
    needs: [metadata, rust-core, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm --workspace @thermoshift/web run e2e
