name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify version metadata consistency
        run: npm run verify:versions
      - name: Verify native cross-platform invariants
        run: npm run verify:native-config

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test canonical engine
        run: cargo test --locked -p thermoshift-core
      - name: Lint canonical engine and WASM bridge
        run: cargo clippy --locked -p thermoshift-core -p thermoshift-wasm --all-targets -- -D warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm ci --ignore-scripts
      - run: npm --workspace @thermoshift/web run wasm:build
      - run: npm --workspace @thermoshift/web run typecheck
      - run: npm --workspace @thermoshift/web run lint
      - run: npm --workspace @thermoshift/web run test
      - run: npm --workspace @thermoshift/web run build:web
      - run: npm run verify:web-budget

  e2e:
    runs-on: ubuntu-latest
    needs: [repository-config, rust-core, web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm --workspace @thermoshift/web run e2e
