name: Bug report
description: Report a reproducible ThermoShift defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve ThermoShift. Do not include secrets or private data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Enter…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ThermoShift version
      placeholder: 0.1.0
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Web/PWA, Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
